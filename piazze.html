<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Palermo - Piazze Siciliane</title>
    <link rel="stylesheet" href="css/style.css"/>
    <link
      href="https://fonts.googleapis.com/css2?family=Besley:wght@400;800&family=Nunito:wght@400;700&display=swap"
      rel="stylesheet"/>
  </head>

  <body class="piazze">
    <header class="navbar-floating">
      <div class="nav-content">
        <a href="index.html" class="home-icon"
          ><img src="icone/home.png"alt="home"/></a>
        <span class="nav-title">Piazze</span>
        <div class="search-bar"><img src="icone/search.png"alt="cerca"/></div>
      </div>
    </header>

    <h1 class="page-title">Palermo</h1>

    <main class="grid-container">
      <div class="city-card">
        <div class="card-image">
          <img src="foto piazze palermo/quattro-canti.jpg"alt="4canti"/>
        </div>
        <div class="card-text"><h4>I Quattro Canti</h4></div>
      </div>
      <div class="city-card">
        <div class="card-image">
          <img src="foto piazze palermo/piazza-pretoria-palermo.jpg"alt="pretoria"/>
        </div>
        <div class="card-text"><h4>Piazza Pretoria</h4></div>
      </div>
      <div class="city-card">
        <div class="card-image">
          <img src="foto piazze palermo/piazza-bellini.jpg"alt="bellini"/>
        </div>
        <div class="card-text"><h4>Piazza Bellini</h4></div>
      </div>
      <div class="city-card">
        <div class="card-image">
          <img src="foto piazze palermo/piazza-marina.jpg"alt="marina"/>
        </div>
        <div class="card-text"><h4>Piazza Marina</h4></div>
      </div>
      <div class="city-card">
        <div class="card-image">
          <img
            src="foto piazze palermo/piazza-san-domenico.jpg"alt="sdomenico"/>
        </div>
        <div class="card-text"><h4>San Domenico</h4></div>
      </div>
      <div class="city-card">
        <div class="card-image">
          <img
            src="foto piazze palermo/piazza-giuseppe-verdi.jpg"alt="verdi"/>
        </div>
        <div class="card-text"><h4>Piazza Verdi</h4></div>
      </div>
    </main>

    <footer>
      <div class="footer-piazze">
        <p>Home</p>
        <p>Contatti</p>
        <p>Help</p>
      </div>
      <img src="icone/social.png"alt="social"/>
    </footer>
  </body>
</html>
